<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CircuitBench 3D</title>
<style>
:root{--bg:#f6f4ef;--card:#ffffffd9;--ink:#1d2433;--mut:#6b7385;--line:#e4e0d6;--acc:#4f46e5;--acc2:#0ea5a4;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:14px "Inter",system-ui,sans-serif}
#c{position:fixed;inset:0}
.top{position:fixed;top:14px;left:14px;right:14px;height:56px;display:flex;align-items:center;gap:10px;padding:0 10px 0 16px;background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 30px #1d243312;z-index:3}
.logo{font-weight:800;font-size:17px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}.logo i{width:26px;height:26px;border-radius:8px;background:conic-gradient(from 200deg,#4f46e5,#0ea5a4,#f59e0b,#4f46e5);display:inline-block}
.seg{display:flex;background:#efece4;border-radius:11px;padding:3px;margin-left:16px}.seg span{padding:7px 14px;border-radius:9px;color:var(--mut);font-weight:600;font-size:13px}.seg span.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px #0001}
.sp{flex:1}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;font:600 13px inherit;color:var(--ink);display:inline-flex;gap:6px;align-items:center}
.btn.p{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.g{background:linear-gradient(90deg,#4f46e5,#0ea5a4);color:#fff;border:0}
.rail{position:fixed;left:14px;top:84px;bottom:14px;width:236px;background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:12px;z-index:3;overflow:hidden}
.rail input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;font:inherit}
.rail h5{margin:14px 4px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.chip{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px;font-weight:500}.chip:hover,.chip.on{background:#efece4}
.chip b{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;background:#fff;border:1px solid var(--line)}
.panel{position:fixed;background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 30px #1d243314;z-index:3;padding:14px}
.panel h4{margin:0 0 8px;font-size:13px}.mut{color:var(--mut);font-size:12px}
.code{right:14px;top:84px;width:400px;bottom:14px;display:flex;flex-direction:column;padding:0;overflow:hidden}
.code .hd{display:flex;gap:8px;align-items:center;padding:12px;border-bottom:1px solid var(--line)}
.code select{border:1px solid var(--line);border-radius:10px;padding:8px;font:600 13px inherit;background:#fff;flex:1}
.ed{flex:1;background:#fbfaf7;font:12.5px/1.6 ui-monospace,Menlo,Consolas,monospace;padding:10px 0;overflow:hidden;counter-reset:l}
.ed div{white-space:pre;padding-left:44px;position:relative}.ed div::before{counter-increment:l;content:counter(l);position:absolute;left:0;width:32px;text-align:right;color:#b7b2a5}
.k{color:#7c3aed}.t{color:#0e7490}.s{color:#15803d}.c{color:#9a9384;font-style:italic}.n{color:#c2410c}
.ai{margin:12px;border-radius:12px;padding:12px;background:linear-gradient(135deg,#eef2ff,#ecfeff);border:1px solid #c7d2fe}
.ai .q{background:#fff;border-radius:9px;padding:9px;border:1px solid var(--line);margin:8px 0;font-size:13px}
.serial{margin:0 12px 12px;background:#1d2433;color:#d7f7e3;border-radius:12px;padding:10px 12px;font:12px/1.6 ui-monospace,monospace;height:120px}
.env{left:264px;bottom:14px;width:300px}
.env label{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:10px}
.bar{height:6px;border-radius:9px;background:#e9e5db;margin-top:6px;position:relative}.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.bar i::after{content:"";position:absolute;right:-7px;top:-5px;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--acc);box-shadow:0 1px 4px #0002}
.view{left:50%;transform:translateX(-50%);bottom:14px;display:flex;gap:6px;padding:6px}
.view span{padding:7px 12px;border-radius:9px;font-weight:600;font-size:12px;color:var(--mut)}.view span.on{background:var(--ink);color:#fff}
#labels{position:fixed;inset:0;pointer-events:none;z-index:2}
.lab{position:absolute;transform:translate(-50%,-100%);background:#fff;border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:12px;font-weight:600;white-space:nowrap;box-shadow:0 4px 14px #1d24331a}
.lab small{display:block;font-weight:500;color:var(--mut)}.lab.hot{border-color:var(--acc);color:var(--acc)}
.lab .i{display:inline-flex;width:17px;height:17px;border-radius:50%;background:var(--acc);color:#fff;font:700 11px Georgia;align-items:center;justify-content:center;margin-left:6px}
.scope{background:#0f172a;border-radius:10px;height:150px;margin-top:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin-top:8px}.kv span:nth-child(odd){color:var(--mut)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:#dcfce7;color:#166534}
.pill.w{background:#fef3c7;color:#92400e}

</div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from '../vendor/three/OrbitControls.js';
import {RoomEnvironment} from '../vendor/three/RoomEnvironment.js';
const view=new URLSearchParams(location.search).get('view')||'mcu';
document.querySelectorAll('#mode span').forEach(s=>s.classList.toggle('on',s.dataset.m===view));

const R=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
R.setPixelRatio(devicePixelRatio);R.setSize(innerWidth,innerHeight);R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.05;R.outputColorSpace=THREE.SRGBColorSpace;
const S=new THREE.Scene();S.background=new THREE.Color('#f6f4ef');
S.environment=new THREE.PMREMGenerator(R).fromScene(new RoomEnvironment(),.04).texture;
const cam=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,1,5000);
const ctl=new OrbitControls(cam,R.domElement);ctl.enableDamping=true;
S.add(new THREE.HemisphereLight('#ffffff','#d8d2c4',.6));
const sun=new THREE.DirectionalLight('#fff',1.6);sun.position.set(-120,260,160);sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);
Object.assign(sun.shadow.camera,{left:-300,right:300,top:300,bottom:-300,far:800});sun.shadow.radius=6;sun.shadow.bias=-.0004;S.add(sun);

// ---------- materials ----------
const M=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.55,metalness:0,...o});
const mat={desk:M('#ebe6dc',{roughness:.9}),bb:M('#f4f3ee',{roughness:.7}),hole:M('#3a3a3a'),pcb:M('#0f6e9c',{roughness:.45}),
 pcbG:M('#1f6b3a',{roughness:.45}),blk:M('#1b1b1d',{roughness:.4}),hdr:M('#121214',{roughness:.6}),metal:M('#c9ccd2',{metalness:1,roughness:.25}),
 gold:M('#d4a843',{metalness:1,roughness:.3}),white:M('#f7f7f4',{roughness:.5}),mesh:M('#9aa0a8',{metalness:.8,roughness:.5}),
 res:M('#d9c49b',{roughness:.5}),red:M('#e11d48'),blue:M('#2563eb')};
const add=(g,m,x=0,y=0,z=0,p=S)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;p.add(o);return o};
const box=(w,h,d,m,x,y,z,p)=>add(new THREE.BoxGeometry(w,h,d),m,x,y,z,p);
const cyl=(r,h,m,x,y,z,p,seg=32)=>add(new THREE.CylinderGeometry(r,r,h,seg),m,x,y,z,p);
const rbox=(w,h,d,r,m,x,y,z,p)=>{const s=new THREE.Shape();s.moveTo(-w/2+r,-d/2);s.lineTo(w/2-r,-d/2);s.quadraticCurveTo(w/2,-d/2,w/2,-d/2+r);s.lineTo(w/2,d/2-r);s.quadraticCurveTo(w/2,d/2,w/2-r,d/2);s.lineTo(-w/2+r,d/2);s.quadraticCurveTo(-w/2,d/2,-w/2,d/2-r);s.lineTo(-w/2,-d/2+r);s.quadraticCurveTo(-w/2,-d/2,-w/2+r,-d/2);
 const g=new THREE.ExtrudeGeometry(s,{depth:h,bevelEnabled:true,bevelSize:.4,bevelThickness:.4,bevelSegments:3});g.rotateX(-Math.PI/2);g.translate(0,-h/2,0);return add(g,m,x,y,z,p)};
const grp=(x=0,y=0,z=0,p=S)=>{const g=new THREE.Group();g.position.set(x,y,z);p.add(g);return g};

// desk
const desk=box(2000,4,2000,mat.desk,0,-2,0);
// subtle cutting-mat grid
const gridT=(()=>{const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');x.fillStyle='#e9e4d8';x.fillRect(0,0,512,512);x.strokeStyle='#ddd6c7';x.lineWidth=2;for(let i=0;i<=512;i+=32){x.beginPath();x.moveTo(i,0);x.lineTo(i,512);x.stroke();x.beginPath();x.moveTo(0,i);x.lineTo(512,i);x.stroke()}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(16,16);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t})();
desk.material=new THREE.MeshStandardMaterial({map:gridT,roughness:.95});

// ---------- part builders ----------
const P=2.54;
function breadboard(x,z,cols=63){const g=grp(x,0,z);const W=cols*P+8,D=56;
 rbox(W,9,D,2,mat.bb,0,4.5,0,g);
 box(W-4,.6,2.2,M('#e7e5de'),0,9.05,0,g); // center channel
 const hg=new THREE.BoxGeometry(1.1,.4,1.1);const pos=[];
 for(let c=0;c<cols;c++){const hx=(c-(cols-1)/2)*P;for(let r=0;r<5;r++){pos.push([hx,(r+1.2)*P]);pos.push([hx,-(r+1.2)*P])}}
 for(let c=0;c<cols;c++){if(c%6===5)continue;const hx=(c-(cols-1)/2)*P;[22.5,25,-22.5,-25].forEach(z=>pos.push([hx,z]))}
 const im=new THREE.InstancedMesh(hg,mat.hole,pos.length);const m4=new THREE.Matrix4();pos.forEach(([a,b],i)=>{m4.makeTranslation(a,9.05,b);im.setMatrixAt(i,m4)});g.add(im);
 [[-23.8,'#dc2626'],[-20.9,'#2563eb'],[20.9,'#dc2626'],[23.8,'#2563eb']].forEach(([zz,c])=>box(W-10,.15,.5,M(c),0,9.1,zz+(zz<0?-1.3:1.3)*0,g));
 return g}
const bbPos=(g,c,r)=>{const cols=63;return new THREE.Vector3(g.position.x+(c-(cols-1)/2)*P,9.2,g.position.z+r)}; // r in mm from center

function arduinoUno(x,z,rot=0){const g=grp(x,0,z);g.rotation.y=rot;
 box(68.6,1.6,53.3,mat.pcb,0,6.8,0,g);
 [[-30,-22],[ 30,-22],[30,22],[-28,22]].forEach(([a,b])=>{cyl(2.4,10,M('#e8e8e8',{metalness:.6,roughness:.3}),a,3,b,g)});
 box(16,11,12,mat.metal,-31,13.1,-12,g); // USB B
 box(13,11,9,mat.blk,-33,13.1,14,g); // barrel jack
 cyl(3,9,mat.blk,-38.5,13.1,14,g).rotation.z=Math.PI/2;
 box(35.5,4,8,mat.blk,10,9.6,12,g); // ATmega328P
 for(let i=0;i<14;i++){box(.6,3,1.2,mat.metal,10+(i-6.5)*P,8.4,7.6,g);box(.6,3,1.2,mat.metal,10+(i-6.5)*P,8.4,16.4,g)}
 cyl(4,2,mat.blk,-12,8.6,10,g).rotation.x=0;
 box(11,3.5,4.5,mat.metal,-12,9.4,-4,g); // crystal
 box(6,5,6,mat.blk,-27,10,-25,g);box(2.5,1.5,2.5,M('#ff4d4d'),-27,12.8,-25,g); // reset
 // headers
 const hdr=(n,hx,hz)=>{box(n*P,8.5,P,mat.hdr,hx,11.8,hz,g);for(let i=0;i<n;i++)box(.9,.3,.9,M('#5b5b5b'),hx+(i-(n-1)/2)*P,16.1,hz,g)};
 hdr(10,-2,-24.6);hdr(8,24,-24.6);hdr(8,2,24.6);hdr(6,24,24.6);
 box(10,4,10,mat.blk,26,9.6,-5,g); // 16U2
 box(3,1,1.6,M('#22c55e',{emissive:'#22c55e',emissiveIntensity:2}),17,8.1,-10,g); // ON led
 box(3,1,1.6,M('#f59e0b',{emissive:'#f59e0b',emissiveIntensity:2}),-6,8.1,-15,g); // L led
 // silkscreen label
 const lab=textPlane('UNO','#ffffff',18,8);lab.position.set(22,7.65,6);g.add(lab);
 return g}
function textPlane(t,color,w,h,bg){const c=document.createElement('canvas');c.width=256;c.height=Math.round(256*h/w);const x=c.getContext('2d');if(bg){x.fillStyle=bg;x.fillRect(0,0,c.width,c.height)}
 x.fillStyle=color;x.font=`bold ${c.height*.7}px Arial`;x.textAlign='center';x.textBaseline='middle';x.fillText(t,c.width/2,c.height/2);
 const tx=new THREE.CanvasTexture(c);tx.colorSpace=THREE.SRGBColorSpace;tx.anisotropy=8;
 const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tx,transparent:true}));m.rotation.x=-Math.PI/2;return m}
function resistor(a,b,bands){const g=grp();const mid=a.clone().add(b).multiplyScalar(.5);const len=a.distanceTo(b);const ang=Math.atan2(b.z-a.z,b.x-a.x);
 g.position.copy(mid);g.rotation.y=-ang;const H=4.5;
 const body=add(new THREE.CapsuleGeometry(1.25,4.2,8,24),mat.res,0,H,0,g);body.rotation.z=Math.PI/2;
 bands.forEach((c,i)=>{const bnd=cyl(1.33,.55,M(c,{roughness:.4}),-1.8+i*1.15,H,0,g);bnd.rotation.z=Math.PI/2});
 const lead=new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new THREE.Vector3(-len/2,-4,0),new THREE.Vector3(-len/2,H-.4,0),new THREE.Vector3(-len/2+1,H,0),new THREE.Vector3(len/2-1,H,0),new THREE.Vector3(len/2,H-.4,0),new THREE.Vector3(len/2,-4,0)],false,'catmullrom',.05),64,.28,8);
 add(lead,mat.metal,0,0,0,g);return g}
function led(p1,color,on){const g=grp(p1.x+P/2,p1.y,p1.z);const lm=new THREE.MeshPhysicalMaterial({color,transmission:.55,roughness:.15,thickness:3,emissive:on?color:'#000',emissiveIntensity:on?2.2:0});
 cyl(2.5,5.2,lm,0,9,0,g);add(new THREE.SphereGeometry(2.5,32,16,0,Math.PI*2,0,Math.PI/2),lm,0,11.6,0,g);cyl(2.9,1,lm,0,6.5,0,g);
 cyl(.25,9,mat.metal,-P/2,2,0,g,8);cyl(.25,8,mat.metal,P/2,2.5,0,g,8);
 if(on){const L=new THREE.PointLight(color,900,90,2);L.position.set(0,14,0);g.add(L)}return g}
function dht22(x,z){const g=grp(x,0,z);const b=rbox(15.1,7.7,25,1,mat.white,0,0,0,g);b.rotation.x=Math.PI/2;b.position.set(0,22,0);
 for(let r=0;r<7;r++)for(let c=0;c<3;c++)box(2.6,1.4,1.2,M('#2b2b2b'),-3.3+c*3.3,14+r*2.5,3.6,g);
 for(let r=0;r<7;r++){box(3.5,1.4,1.2,M('#2b2b2b'),-6,14+r*2.5,3.6,g);box(3.5,1.4,1.2,M('#2b2b2b'),6,14+r*2.5,3.6,g)}
 cyl(2.5,1.2,M('#2b2b2b'),0,32.2,3.6,g).rotation.x=Math.PI/2;
 for(let i=0;i<4;i++)box(.6,12,.4,mat.metal,(i-1.5)*P,4,0,g);return g}
function hcsr04(x,z){const g=grp(x,0,z);box(45,20,1.6,mat.pcb,0,18,0,g);
 [-13,13].forEach(px=>{const c=cyl(8,12,mat.metal,px,18,6.8,g,48);c.rotation.x=Math.PI/2;const m=cyl(7,.4,M('#3d4148',{roughness:.9}),px,18,12.9,g,48);m.rotation.x=Math.PI/2});
 box(5,3,4,mat.metal,0,24,2,g);for(let i=0;i<4;i++)box(.6,12,.6,mat.metal,(i-1.5)*P,4,0,g);
 const t=textPlane('HC-SR04','#fff',18,4);t.rotation.set(0,0,0);t.position.set(0,26,-.85);t.rotation.y=Math.PI;g.add(t);return g}
function dip(n,cx,y,cz,label){const g=grp(cx,y,cz);const w=n/2*P;box(w,3.4,6.4,mat.blk,0,4.4+y*0,0,g);
 const notch=cyl(.9,.3,M('#333'),-w/2+1.4,6.15,0,g);
 for(let i=0;i<n/2;i++){const lx=(i-(n/2-1)/2)*P;[-1,1].forEach(s=>{box(.5,.5,1.4,mat.metal,lx,4.6,s*3.7,g);box(.5,6,.3,mat.metal,lx,1.6,s*4.1,g)})}
 if(label){const t=textPlane(label,'#cfcfcf',10,3);t.position.set(.4,6.16,0);g.add(t)}return g}
function ecap(p,h=11,r=3){const g=grp(p.x+P/2,0,p.z);cyl(r,h,M('#1e3a8a',{roughness:.35}),0,9+h/2+1,0,g);cyl(r*.98,.3,mat.metal,0,9+h+1.1,0,g);box(1,h,.2,M('#cbd5e1'),r-.3,9+h/2+1,0,g);return g}
function trimpot(p){const g=grp(p.x,0,p.z);box(9.5,5,9.5,M('#2f55d4'),0,13,0,g);const k=cyl(3,1.6,M('#f2f2f2'),0,16.2,0,g);box(4,.4,.8,M('#888'),0,17.1,0,g);return g}
function wire(pts,color,lift=14){const v=pts.map(p=>p.clone());const a=v[0],b=v[v.length-1];
 const ctrl=[a.clone(),a.clone().add(new THREE.Vector3(0,lift*.7,0)),...v.slice(1,-1).map(p=>p.clone().setY(p.y+lift)),
  a.clone().lerp(b,.5).setY(Math.max(a.y,b.y)+lift),b.clone().add(new THREE.Vector3(0,lift*.7,0)),b.clone()];
 if(v.length>2)ctrl.splice(ctrl.length-4,1);
 const curve=new THREE.CatmullRomCurve3(ctrl,false,'centripetal');add(new THREE.TubeGeometry(curve,120,.75,10),M(color,{roughness:.45}));
 [a,b].forEach(p=>{cyl(.9,3.2,M('#2a2a2a'),p.x,p.y+1.5,p.z,S,12)})}
const V=(x,y,z)=>new THREE.Vector3(x,y,z);

// ---------- scenes ----------
const labels=[];const L=(t,sub,v,hot,info)=>labels.push({t,sub,v,hot,info});
const UI=document.getElementById('ui');

if(view==='mcu'){
 const bb=breadboard(30,0);const uno=arduinoUno(-110,6);
 const d=dht22(bbPos(bb,8,0).x+P*1.5,bbPos(bb,8,-6).z-2);
 const sr=hcsr04(bbPos(bb,40,0).x+P*1.5,-9);
