<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ccbb Circuit Studio</title>
<link rel="stylesheet" href="ui/style.css">
<script src="../vendor/wokwi-elements.bundle.js"></script>
<script type="module" src="ui/custom-parts.js"></script>
<script type="module" src="ui/main.js"></script>
</head><body>
<header class="top">
  <div class="brand"><span class="logo"></span>ccbb <small>Circuit Studio</small></div>
  <label class="field">Start from <select id="projects"><option value="">Choose a project…</option></select></label>
  <button id="btnNew" class="btn">New</button>
  <button id="btnExport" class="btn">Save file</button>
  <label class="btn">Open file<input id="fileIn" type="file" accept=".json" hidden></label>
  <span class="grow"></span>
  <span id="simState" class="pill">● Live</span>
</header>
<div class="steps"><b>①</b> Click a part on the left to add it <b>②</b> Click a pin, then another pin, to connect a wire <b>③</b> Press <b>Run</b> to start your code. <span class="mut">Drag a part by its name tag · Select + Delete to remove · Esc cancels a wire</span></div>
<main>
  <aside class="palette" id="palette"></aside>
  <section class="board" id="board">
    <div class="scroll" id="scroll"><div class="world" id="world">
      <div id="parts"></div>
      <svg class="wires" id="wires"></svg>
      <svg class="pins" id="pins"></svg>
    </div></div>
    <div class="tip" id="tip"></div>
    <div class="zoom"><button class="btn icon" id="zOut" title="Zoom out">−</button><span id="zoomLbl">125%</span><button class="btn icon" id="zIn" title="Zoom in">+</button></div>
    <div class="panel props" id="props" hidden></div>
    <div class="panel warns" id="warns"></div>
  </section>
  <aside class="code" id="code">
    <div class="code-hd">
      <button class="btn icon" id="btnMin" title="Hide / show code">⇥</button>
      <select id="boardSel" title="Microcontroller">
        <option value="uno">Arduino Uno (ATmega328P)</option>
        <option disabled>Arduino Nano (coming soon)</option>
        <option disabled>ESP32 DevKit (coming soon)</option>
        <option disabled>Raspberry Pi Pico (coming soon)</option>
      </select>
    </div>
    <div class="code-actions">
      <button class="btn run" id="btnRun">▶ Run</button>
      <button class="btn" id="btnStop" disabled>■ Stop</button>
      <button class="btn magic" id="btnAuto" title="Writes starter code from your wiring">✨ Code from my circuit</button>
    </div>
    <div class="editor"><pre class="gutter" id="gutter"></pre><textarea id="src" spellcheck="false"></textarea></div>
    <div class="err" id="err" hidden></div>
    <div class="serial"><div class="serial-hd">Serial Monitor <button class="link" id="btnClear">clear</button></div><pre id="serial"></pre></div>
  </aside>
</main>
</body></html>
